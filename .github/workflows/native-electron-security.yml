name: M04 native Electron security

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/components/PersonalTabView.tsx'
      - 'src/components/StreamedTabView.tsx'
      - 'scripts/security/electron-native-e2e.cjs'
      - '.github/workflows/native-electron-security.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:

# Alternate verified Electron release mirror (GitHub release CDN returned 503).
# @electron/get still validates Electron's embedded official SHA256 checksums.
env:
  ELECTRON_MIRROR: https://repo.huaweicloud.com/electron/
  ELECTRON_CUSTOM_DIR: '{{ version }}'

permissions:
  contents: read

jobs:
  hostile-site-smoke:
    name: Native hostile-site smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native Electron runtime
        run: npm ci
      - name: Provision real Linux Chromium setuid sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%a' node_modules/electron/dist/chrome-sandbox)" = 4755
      - name: Linux sandboxed hostile guest
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npx electron scripts/security/electron-native-e2e.cjs
      - name: macOS / Windows hostile guest
        if: runner.os != 'Linux'
        run: npx electron scripts/security/electron-native-e2e.cjs
