name: M04/M05 native Electron security

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/components/PersonalTabView.tsx'
      - 'src/lib/browser/useGuestPartition.ts'
      - 'src/components/StreamedTabView.tsx'
      - 'scripts/security/electron-native-e2e.cjs'
      - 'scripts/security/electron-profile-restart-e2e.cjs'
      - 'scripts/security/electron-profile-storage.cjs'
      - 'scripts/security/run-electron-native-e2e.cjs'
      - '.github/workflows/native-electron-security.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:

# Alternate verified Electron release mirror (GitHub release CDN returned 503).
# @electron/get still validates Electron's embedded official SHA256 checksums.
env:
  ELECTRON_MIRROR: https://repo.huaweicloud.com/electron/
  ELECTRON_CUSTOM_DIR: '{{ version }}'

permissions:
  contents: read

jobs:
  hostile-site-smoke:
    name: Native hostile-site and browser-profile smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native Electron runtime
        run: npm ci
      - name: Provision real Linux Chromium setuid sandbox
        if: runner.os == 'Linux'
        run: |
          # npm package may lazily download Electron at first invocation.
          # Explicitly install it BEFORE changing the real sandbox helper.
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%a' node_modules/electron/dist/chrome-sandbox)" = 4755
      - name: Linux native hostile guest and restart assertions
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scripts/security/run-electron-native-e2e.cjs
      - name: macOS / Windows native hostile guest and restart assertions
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: node scripts/security/run-electron-native-e2e.cjs
