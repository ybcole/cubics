name: Next desktop UI build smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-smoke.cjs'
      - '.github/workflows/build-smoke.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/cubics
      - name: Compile and check Next.js routes against framework
        run: node scripts/build-smoke.cjs
