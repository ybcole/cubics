appId: com.cubics.app
productName: Cubics
copyright: Copyright © 2026

directories:
  app: .desktop-staging
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json
  - "!**/node_modules/**"
  - "!**/.env*"
  - "!**/.next/**"
  - "!**/prisma/**"
  - "!**/server/**"

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  hardenedRuntime: false

win:
  target: nsis

linux:
  target: AppImage
  category: Utility

npmRebuild: false
