appId: com.cubics.app
productName: Cubics
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

# The Next.js standalone server ships as loose files (not asar) so the
# spawned Node server can resolve its traced dependencies normally.
extraResources:
  - from: .next/standalone
    to: server

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  hardenedRuntime: false

win:
  target: nsis

linux:
  target: AppImage
  category: Utility

npmRebuild: false
